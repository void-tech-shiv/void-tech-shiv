<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="About Shivanshu Satyajeet">

<defs>
  <filter id="gb" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="gr" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient>
  <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#14223a"/></pattern>
</defs>

<style>
  .bg{fill:#070b16}.panel{fill:#0d1527;stroke:#20395f;stroke-width:2}.line{stroke:#223b65;stroke-width:2;fill:none}.blue{fill:#247bff}.red{fill:#ff354f}.txt{fill:#f6f7fb;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#9ba9c3;font-family:Inter,Segoe UI,Arial,sans-serif}.mono{fill:#87a1c7;font-family:SFMono-Regular,Consolas,monospace}.chip{fill:#111d33;stroke:#2b4670;stroke-width:1.5}.dot{fill:#14223a}.glowB{filter:url(#gb)}.glowR{filter:url(#gr)}
  @media (prefers-reduced-motion: reduce){.cssAnim{animation:none!important}}
</style>

<rect width="1200" height="520" rx="30" class="bg"/><rect x="1.5" y="1.5" width="1197" height="517" rx="29" fill="none" stroke="#20395f" stroke-width="3"/>
<text x="60" y="72" class="mono" font-size="18">01 / ABOUT + INTERESTS</text><text x="60" y="124" class="txt" font-size="42" font-weight="800">I BUILD SYSTEMS THAT SHOULD HOLD UP.</text>
<text x="60" y="158" class="muted" font-size="20">Security-minded engineering with a bias toward working prototypes.</text>
<g transform="translate(60 205)">
 <rect width="520" height="250" rx="24" class="panel"/>
 <text x="32" y="48" class="txt" font-size="24" font-weight="700">CAPABILITIES</text>
 <g transform="translate(30 76)"><rect width="218" height="48" rx="14" class="chip"/><text x="109" y="31" text-anchor="middle" class="txt" font-size="17">Security Engineering</text></g>
 <g transform="translate(266 76)"><rect width="218" height="48" rx="14" class="chip"/><text x="109" y="31" text-anchor="middle" class="txt" font-size="17">Backend APIs</text></g>
 <g transform="translate(30 140)"><rect width="218" height="48" rx="14" class="chip"/><text x="109" y="31" text-anchor="middle" class="txt" font-size="17">Detection Logic</text></g>
 <g transform="translate(266 140)"><rect width="218" height="48" rx="14" class="chip"/><text x="109" y="31" text-anchor="middle" class="txt" font-size="17">Frontend Systems</text></g>
 <g transform="translate(30 204)"><rect width="454" height="26" rx="13" fill="#0a1020"/><rect width="360" height="26" rx="13" fill="url(#edge)"><animate attributeName="width" values="50;454;50" dur="7s" repeatCount="indefinite"/></rect></g>
</g>
<g transform="translate(620 205)"><rect width="520" height="250" rx="24" class="panel"/><text x="32" y="48" class="txt" font-size="24" font-weight="700">CURRENT INTERESTS</text>
 <g opacity="1"><text x="32" y="104" class="blue" font-size="18" font-family="monospace">01</text><text x="78" y="106" class="txt" font-size="30" font-weight="750">AUTONOMOUS SOC</text><text x="32" y="146" class="muted" font-size="18">Detection, correlation and incident workflows.</text><animate attributeName="opacity" values="1;1;0;0;0;1" keyTimes="0;.29;.33;.96;.98;1" dur="12s" repeatCount="indefinite"/></g>
 <g opacity="0"><text x="32" y="104" class="red" font-size="18" font-family="monospace">02</text><text x="78" y="106" class="txt" font-size="30" font-weight="750">IDENTITY SECURITY</text><text x="32" y="146" class="muted" font-size="18">OCR, document validation and explainable risk.</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.31;.35;.62;.66;1" dur="12s" repeatCount="indefinite"/></g>
 <g opacity="0"><text x="32" y="104" class="blue" font-size="18" font-family="monospace">03</text><text x="78" y="106" class="txt" font-size="30" font-weight="750">SECURE DEV TOOLS</text><text x="32" y="146" class="muted" font-size="18">Useful security products with clean UX.</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.64;.68;.95;1" dur="12s" repeatCount="indefinite"/></g>
 <g transform="translate(32 194)"><rect width="140" height="7" rx="4" fill="#20395f"/><rect width="140" height="7" rx="4" fill="#247bff"><animate attributeName="width" values="0;140;0;0" keyTimes="0;.31;.33;1" dur="12s" repeatCount="indefinite"/></rect><rect x="157" width="140" height="7" rx="4" fill="#20395f"/><rect x="157" width="140" height="7" rx="4" fill="#ff354f"><animate attributeName="width" values="0;0;140;0;0" keyTimes="0;.33;.64;.66;1" dur="12s" repeatCount="indefinite"/></rect><rect x="314" width="140" height="7" rx="4" fill="#20395f"/><rect x="314" width="140" height="7" rx="4" fill="#247bff"><animate attributeName="width" values="0;0;140;0" keyTimes="0;.66;.97;1" dur="12s" repeatCount="indefinite"/></rect></g>
</g>
</svg>